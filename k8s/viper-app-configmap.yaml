apiVersion: v1
kind: ConfigMap
metadata:
  name: viper-app-config
  labels:
    app: viper-app
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: root
  DB_NAME: viper_db
  MEMCACHED_HOST: memcached
  PORT: "3000"
  SERVICE_URL: http://viper-app:3000
  # These will be overridden when deployed via Marketplace with auto-detected URL
  APP_HOST: localhost
  DOMAIN_NAME: localhost
  NODE_ENV: development
  # Kubernetes service discovery
  SERVICE_NAME: viper-app
  POD_NAMESPACE: default
