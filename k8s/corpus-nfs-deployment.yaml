apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corpus-nfs-storage
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corpus-nfs-server
  namespace: default
  labels:
    app: corpus-nfs-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corpus-nfs-server
  template:
    metadata:
      labels:
        app: corpus-nfs-server
    spec:
      containers:
      - name: nfs-server
        image: itsthenetwork/nfs-server-alpine:latest
        ports:
        - name: nfs
          containerPort: 2049
        - name: mountd
          containerPort: 20048
        - name: rpcbind
          containerPort: 111
        securityContext:
          privileged: true
        env:
        - name: SHARED_DIRECTORY
          value: "/corpus"
        volumeMounts:
        - name: corpus-storage
          mountPath: /corpus
      volumes:
      - name: corpus-storage
        persistentVolumeClaim:
          claimName: corpus-nfs-storage
---
apiVersion: v1
kind: Service
metadata:
  name: corpus-nfs-server
  namespace: default
spec:
  selector:
    app: corpus-nfs-server
  ports:
  - name: nfs
    port: 2049
    targetPort: 2049
  - name: mountd
    port: 20048
    targetPort: 20048
  - name: rpcbind
    port: 111
    targetPort: 111
  type: ClusterIP
