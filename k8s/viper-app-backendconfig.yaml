apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: viper-app-backendconfig
  namespace: default
spec:
  healthCheck:
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /healthz
    port: 3000
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
