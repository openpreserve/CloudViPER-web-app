version: '3'
services:
  app:
    # image: darrenopf/viper-web-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-viper-gui-app
    ##########################################
    # use 'ports' for local dev. 'expose' with
    # Traefik for more security. 
    expose:
      - '3000'
    # Uncomment for local dev/debugging:
    # ports:
    #   - "3333:3000"
    restart: always
    env_file: ./web-app/.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./web-app/logs:/usr/src/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/src/app/scripts
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - cloud-viper-net
      - cloudviper_ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloudviper-app.rule=Host(`ddhn.cloudviper.org`)"
      - "traefik.http.routers.cloudviper-app.entrypoints=websecure"
      - "traefik.http.routers.cloudviper-app.tls=true"
      - "traefik.http.routers.cloudviper-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.cloudviper-app.loadbalancer.server.port=3000"
      - "traefik.docker.network=cloudviper_ingress"
    ##########################################
    # Production command  
    command: [ "node", "dist/app.js" ]
    # Development command - optimized for TypeScript + Handlebars
    # command: ["sh", "-c", "npm ci && npx nodemon --watch src --ext ts,js,handlebars --exec 'npx ts-node --transpile-only src/app.ts'"]

  mysqldb:
    image: mysql:8.0
    container_name: cloud-viper-mysqldb
    restart: always
    env_file: ./web-app/.env
    environment:
      EXPIRE_LOGS_DAYS: 3
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M
    ports:
      - 3306:3306
    volumes:
      - ./volumes/mysql_8_data:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --skip-log-bin --performance-schema=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cloud-viper-net

  # optional: The google cloud or amazon firewall should be configured to NOT open any database related ports, these are open so that they can be forwarded via SSH should the be needed for database access
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    expose:
      - 80
    depends_on:
      - mysqldb
    networks:
      - cloud-viper-net
      - cloudviper_ingress
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pma-cloudviper.rule=Host(`pma.cloudviper.org`)"
      - "traefik.http.routers.pma-cloudviper.entrypoints=websecure"
      - "traefik.http.routers.pma-cloudviper.tls=true"
      - "traefik.http.routers.pma-cloudviper.tls.certresolver=letsencrypt"
      - "traefik.http.services.pma-cloudviper.loadbalancer.server.port=80"
      - "traefik.docker.network=cloudviper_ingress"

networks:
  cloud-viper-net:
    name: cloud-viper-net
    driver: bridge
  # Traefik ingress network
  cloudviper_ingress:
    external: true
    name: cloudviper_ingress
