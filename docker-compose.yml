version: '3'
services:
  app:
    # image: darrenopf/viper-web-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - '3000'
    restart: always
    env_file: ./src/.env
    environment:
      - VIRTUAL_PORT=3000
      - VIRTUAL_HOST=www.vipercloud.cc
      - LETSENCRYPT_HOST=www.vipercloud.cc
      - LETSENCRYPT_EMAIL=sysadmin@openpreservation.org
    volumes:
      - ./src:/usr/src/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mysqldb
    networks:
      - viper-gui
      - ingress-proxy
    command: ["sh", "-c", "npm install && npm install -g nodemon && nodemon app.js"]
    
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb-viper-cloud
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: TX2vvhVifqRZCM6JkxkWknD4TLYszR7aD
      MYSQL_DATABASE: viper_db
      MYSQL_USER: viper_root
      MYSQL_PASSWORD: TX2vvhVifqRZCM6JkxkWknD4TLYszR7aD
    ports:
      - 3306:3306
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql
    networks:
      - viper-gui

  # optional: The google cloud or amazon firewall should be configured to NOT open any database related ports, these are open so that they can be forwarded via SSH should the be needed for database access
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "8383:80"
    depends_on:
      - mysqldb
    networks:
      - viper-gui

networks:
  viper-gui:
  ingress-proxy:
    external:
      name: ingress-proxy