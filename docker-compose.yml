version: '3'
services:
  app:
    # image: darrenopf/viper-web-gui:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-viper-gui-app
    ##########################################
    # use 'ports' for local dev. 'expose' with
    # ingress-nginx for more security. 
    expose:
      - '3000'
    ports:
      - "3333:3000"
    restart: always
    env_file: ./web-app/.env.production.local
    environment:
      - VIRTUAL_PORT=3000
      - VIRTUAL_HOST=${DOMAIN_NAME:-cloudviper.org}
      - LETSENCRYPT_HOST=${DOMAIN_NAME:-cloudviper.org}
      - LETSENCRYPT_EMAIL=sysadmin@openpreservation.org
      - DOMAIN_NAME=${DOMAIN_NAME:-cloudviper.org}
      - NODE_ENV=dev
    volumes:
      - ./web-app/logs:/usr/src/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/usr/src/app/scripts
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - cloud-viper-net
      # - ingress-proxy
    ##########################################
    # Production command  
    command: [ "node", "dist/app.js" ]
    # Development command - optimized for TypeScript + Handlebars
    # command: ["sh", "-c", "npm ci && npx nodemon --watch src --ext ts,js,handlebars --exec 'npx ts-node --transpile-only src/app.ts'"]
    
  mysqldb:
    image: mysql:8.0
    container_name: cloud-viper-mysqldb
    restart: always
    env_file: ./web-app/.env.production.local
    ports:
      - 3306:3306
    volumes:
      - ./volumes/mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --expire_logs_days=7 --max_binlog_size=500M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cloud-viper-net

  # optional: The google cloud or amazon firewall should be configured to NOT open any database related ports, these are open so that they can be forwarded via SSH should the be needed for database access
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "8383:80"
    depends_on:
      - mysqldb
    networks:
      - cloud-viper-net

networks:
  cloud-viper-net:
    name: cloud-viper-net
    driver: bridge
  # If using a proxy, uncomment the following lines
  # ingress-proxy:
  #   external: true
  #   name: ingress-proxy